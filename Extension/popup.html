<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #1e1e22;
      --bg-surface: #26262c;
      --bg-elevated: #313138;
      --border-subtle: #38383f;
      --border-default: #48484f;
      --text-primary: #d4d4dc;
      --text-secondary: #9494a2;
      --text-muted: #6a6a78;
      --accent: #d4a574;
      --accent-hover: #ddb486;
      --accent-glow: rgba(212, 165, 116, 0.12);
      --teal: #6ca0b8;
      --success: #7fb88a;
      --error: #c97474;
      --warning: #c9a86c;
      --font-mono: 'JetBrains Mono', 'SF Mono', 'Consolas', monospace;
      --font-sans: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --radius: 8px;
      --transition: 160ms ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    ::selection {
      background: var(--accent);
      color: var(--bg-base);
    }

    body {
      width: 340px;
      min-height: 200px;
      margin: 0;
      padding: 0;
      font-family: var(--font-sans);
      background: var(--bg-base);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.025'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    .popup-container {
      padding: 20px;
      position: relative;
      z-index: 1;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .logo-mark {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      flex-shrink: 0;
    }

    .logo-mark svg {
      width: 100%;
      height: 100%;
    }

    .header-text h1 {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
      margin-bottom: 2px;
    }

    .header-text p {
      font-size: 10px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      letter-spacing: 0.03em;
    }

    /* Action Card */
    .action-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      padding: 18px;
    }

    .action-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .action-icon {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--accent-glow);
      border-radius: var(--radius);
      color: var(--accent);
    }

    .action-title {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: 0.02em;
    }

    .action-description {
      font-size: 11px;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 16px;
    }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 11px 16px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all var(--transition);
      letter-spacing: 0.02em;
    }

    .btn svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--bg-base);
      border-color: var(--accent);
      font-weight: 600;
      margin-bottom: 8px;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      box-shadow: 0 0 20px var(--accent-glow);
      transform: translateY(-1px);
    }

    .btn-danger {
      background: transparent;
      color: var(--error);
      border-color: rgba(201, 116, 116, 0.3);
    }

    .btn-danger:hover {
      background: rgba(201, 116, 116, 0.08);
      border-color: var(--error);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
    }

    /* Status Message */
    .status-message {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: var(--radius);
      font-family: var(--font-mono);
      font-size: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      animation: fadeIn 0.2s ease-out;
    }

    .status-message.success {
      background: rgba(127, 184, 138, 0.08);
      border: 1px solid rgba(127, 184, 138, 0.2);
      color: var(--success);
    }

    .status-message.error {
      background: rgba(201, 116, 116, 0.08);
      border: 1px solid rgba(201, 116, 116, 0.2);
      color: var(--error);
    }

    .status-message.warning {
      background: rgba(201, 168, 108, 0.08);
      border: 1px solid rgba(201, 168, 108, 0.2);
      color: var(--warning);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-message.success .status-dot {
      background: var(--success);
    }

    .status-message.error .status-dot {
      background: var(--error);
    }

    .status-message.warning .status-dot {
      background: var(--warning);
    }

    /* Footer */
     .footer {
       margin-top: 16px;
       padding-top: 14px;
       border-top: 1px solid var(--border-subtle);
       display: flex;
       align-items: center;
       justify-content: space-between;
     }

    /* ── History Card ─────────────────── */
    .history-card {
      margin-top: 10px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      padding: 12px;
    }
    .history-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .history-card-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }
    .history-card-actions {
      display: flex;
      gap: 4px;
    }
    .btn-icon-sm {
      padding: 3px 8px;
      font-size: 10px;
      font-weight: 600;
      border-radius: 4px;
      border: 1px solid var(--border-default);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      font-family: var(--font-mono);
      transition: var(--transition);
    }
    .btn-icon-sm:hover { color: var(--text-primary); border-color: var(--accent); }
    .btn-danger-sm { border-color: var(--error); color: var(--error); }
    .btn-danger-sm:hover { background: rgba(201, 116, 116, 0.1); }
    .history-list { max-height: 150px; overflow-y: auto; }
    .history-empty { font-size: 11px; color: var(--text-muted); text-align: center; padding: 8px 0; }
    .history-entry { padding: 6px 0; border-bottom: 1px solid var(--border-subtle); }
    .history-entry:last-child { border-bottom: none; }
    .history-meta { display: flex; gap: 6px; align-items: center; font-size: 10px; color: var(--text-muted); }
    .history-tag { color: var(--teal); font-family: var(--font-mono); }
    .history-host { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history-time { flex-shrink: 0; }
    .history-preview { font-size: 10px; color: var(--text-secondary); font-family: var(--font-mono); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .footer-hint {
      font-size: 10px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    .version-tag {
      font-size: 9px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      letter-spacing: 0.08em;
      padding: 3px 6px;
      background: var(--bg-elevated);
      border-radius: 3px;
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <div class="logo-mark">
        <svg viewBox="0 0 32 32" fill="none">
          <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="16" cy="16" r="5" fill="currentColor"/>
          <line x1="16" y1="2" x2="16" y2="7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="16" y1="25" x2="16" y2="30" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="2" y1="16" x2="7" y2="16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="25" y1="16" x2="30" y2="16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="header-text">
        <h1>Element Locator Generator</h1>
        <p>OpenRouter Edition</p>
      </div>
    </header>

    <div class="action-card">
      <div class="action-header">
        <div class="action-icon">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M8 1v14M1 8h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="action-title">Persistent Mode</span>
      </div>

      <p class="action-description">
        Enable continuous element selection. Click any element to generate locators. Mode persists across page navigation.
      </p>

      <button id="enablePersistentMode" class="btn btn-primary">
        <svg viewBox="0 0 16 16" fill="none">
          <path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        Enable Mode
      </button>

      <button id="disablePersistentMode" class="btn btn-danger hidden">
        <svg viewBox="0 0 16 16" fill="none">
          <rect x="3" y="3" width="10" height="10" rx="1" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        Disable Mode
      </button>

       <div id="actionStatus"></div>
     </div>

     <div class="history-card">
       <div class="history-card-header">
         <span class="history-card-title">History &amp; Export</span>
         <div class="history-card-actions">
           <button id="exportJSON" class="btn-icon-sm" title="Export JSON">JSON</button>
           <button id="exportCSV" class="btn-icon-sm" title="Export CSV">CSV</button>
           <button id="exportPOM" class="btn-icon-sm" title="Export Page Object">POM</button>
           <button id="clearHistory" class="btn-icon-sm btn-danger-sm" title="Clear History">Clear</button>
         </div>
       </div>
       <div id="historyList" class="history-list"></div>
     </div>

     <footer class="footer">
      <span class="footer-hint">Press ESC to cancel</span>
      <span class="version-tag">v1.0</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
